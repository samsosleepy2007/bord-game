name: Restore exact Skill Canvas server

on:
  push:
    branches: [main]
    paths:
      - ".upload-parts/server.01"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify server.js
        shell: bash
        run: |
          cat .upload-parts/server.00 .upload-parts/server.01 | tr -d '\n\r' | base64 -d | gzip -d > server.js
          printf '%s  %s\n' '2db61121e1746d4e7066bcd8d4cda3acf2188944d36ad0afdaf78e809e573b7a' 'server.js' | sha256sum -c -
          node --check server.js

      - name: Commit exact server
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo "server.js already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Restore exact Skill Canvas server"
          git push
