name: Fix exact Skill Canvas server

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-server-exact.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PART1: ''
      PART2: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact server
        shell: bash
        run: |
          printf '%s%s' "$PART1" "$PART2" | base64 -d | gzip -d > server.js
          printf '%s  %s\n' '2db61121e1746d4e7066bcd8d4cda3acf2188944d36ad0afdaf78e809e573b7a' 'server.js' | sha256sum -c -
          node --check server.js
      - name: Commit exact server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix exact Skill Canvas server"
          git push
